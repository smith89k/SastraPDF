<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#EEF3FA;
  background:
    radial-gradient(820px 460px at 50% 118%,rgba(255,107,94,.14),transparent 72%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/26px 26px,
    #0D1117;}
.page{width:100%;height:100%;padding:44px 56px 0;display:flex;flex-direction:column}

h1{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1}
h1 .a{color:#FF6B5E}
.sub{margin-top:12px;font-size:21px;font-weight:450;color:#919AA7;letter-spacing:-.012em}
.tag{font-size:25px;font-weight:700;letter-spacing:-.022em}
.tag .a{color:#FF6B5E}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;min-height:0}

.win{background:#161B22;border:1px solid rgba(255,255,255,.10);border-radius:18px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.10);flex:0 0 auto}
.bar .t{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8B94A3;text-transform:uppercase}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:6px 14px;
  font-size:12.5px;color:#8B94A3;font-weight:500}
.pad{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.mono{font-family:'JetBrains Mono',Consolas,monospace;color:#D7DFEA}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:#8B94A3;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);padding:5px 11px;
  border-radius:999px;white-space:nowrap}
.chip.on{color:#fff;background:#FF6B5E;border-color:transparent}
.ok{display:inline-flex;align-items:center;gap:7px;background:rgba(63,185,80,.16);color:#4FC463;
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.warn{background:rgba(240,160,60,.16);color:#F0A83C}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.muted{color:#919AA7}
.accent{color:#FF6B5E}
.row{display:flex;align-items:center;gap:11px}
.grow{flex:1}
.logo{filter:drop-shadow(0 14px 30px rgba(0,0,0,.30))}

.bench{width:1072px;height:396px;margin:0 auto -38px}
.rail{width:132px;flex:0 0 auto;border-right:1px solid rgba(255,255,255,.10);padding:14px 12px;
  display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.04)}
.pg{position:relative;padding-top:128%;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);
  border-radius:6px}
.pg.on{box-shadow:0 0 0 2.5px #FF6B5E}
.pg b{position:absolute;left:9px;right:9px;top:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
.pg b.b{top:20px}.pg b.c{top:28px;right:46%}
.canvas{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:18px;
  background:rgba(255,255,255,.055)}
.sheet{width:268px;background:#FFFFFF;border:1px solid rgba(0,0,0,.12);border-radius:7px;
  padding:19px 17px;box-shadow:0 10px 26px rgba(0,0,0,.14)}
.sheet i{display:block;height:7px;border-radius:3.5px;background:#D3D7DD;margin-bottom:9px}
.sheet i.hl{background:#FFE08A}
.sheet i.s{width:62%}
.tools{width:196px;flex:0 0 auto;border-left:1px solid rgba(255,255,255,.10);padding:15px 14px;
  display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.04)}
.tools .lbl{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:#8B94A3;margin-top:4px}
.tbar{display:flex;gap:7px;align-items:center}

</style></head><body><div class="page">
<div style="display:flex;flex-direction:column;text-align:center;align-items:center;flex:0 0 auto"><h1>Sastra PDF</h1><div class="sub">A fast, private PDF workbench for Windows</div></div><div class="mid"><div class="win bench"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><div class="tbar" style="margin-left:10px"><span class="chip">Rotate</span><span class="chip">Extract</span><span class="chip">Combine</span><span class="chip on">Highlight</span><span class="chip">Crop</span></div><span class="grow"></span><span class="pill">sastra-khmer.pdf &middot; 24 pages</span></div><div style="display:flex;flex:1;min-height:0"><div class="rail"><div class="pg"><b></b><b class="b"></b><b class="c"></b></div><div class="pg on"><b></b><b class="b"></b><b class="c"></b></div><div class="pg on"><b></b><b class="b"></b><b class="c"></b></div><div class="pg"><b></b><b class="b"></b><b class="c"></b></div></div><div class="canvas"><div class="sheet"><i style="width:70%;height:11px;background:#B9BFC7"></i><i></i><i class="hl"></i><i></i><i class="s"></i><i></i><i class="hl" style="width:78%"></i><i></i><i class="s"></i><i></i><i style="width:44%"></i></div></div><div class="tools"><div class="lbl">Print</div><span class="chip on">Booklet, both sides</span><span class="chip">2 pages per sheet</span><span class="chip">Khmer page numbers</span><div class="lbl">Export</div><span class="chip">PNG &middot; 300 dpi</span><div class="lbl" style="margin-top:auto">12 sheets</div></div></div></div></div>
</div></body></html>
